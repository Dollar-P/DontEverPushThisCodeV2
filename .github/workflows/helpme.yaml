name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Workshop-wide permissions; production pipelines should restrict these per job.
permissions:
  contents: read
  security-events: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  # GATE 0 — Search for credentials accidentally stored in the repository.
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog — verified credentials in changed commits
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true  # Workshop only: preserve other scan results.
        with:
          path: ./
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}
          extra_args: --results=verified
      - name: Gitleaks — pattern-based secret detection
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true  # Workshop only.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'true'
          GITLEAKS_ENABLE_SUMMARY: 'true'

  # GATE 1a — Code analysis results live on the SonarQube Cloud project.
  sast-scan:
    needs: secret-scanning
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history for Sonar blame analysis
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7.1.0
        continue-on-error: true  # Workshop only.
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # GATE 1b — GitHub CodeQL analysis of the JavaScript/TypeScript codebase.
  codeql-scan:
    needs: secret-scanning
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: ['javascript-typescript']
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # GATE 2 — Scan npm packages for known CVEs.
  dependency-scanning:
    needs: [secret-scanning, sast-scan]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm ci
      - name: OWASP Dependency-Check
        id: depcheck
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true  # Workshop only.
        with:
          project: 'DontEverPushThisCodeV2'
          path: '.'
          format: 'ALL'  # Includes SARIF for GitHub and HTML for review.
          out: 'reports'
          args: >
            --failOnCVSS 7
            --enableRetired
      - name: Upload Dependency-Check SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: reports/dependency-check-report.sarif
          category: dependency-check
      - name: Preserve Dependency-Check reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depcheck-report
          path: reports/
          if-no-files-found: warn

  # GATE 3 — Scan packages embedded in the Docker image.
  image-scanning:
    needs: [dependency-scanning]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build image
        run: docker build -t my-app:latest .
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@master
        continue-on-error: true  # Workshop only.
        with:
          image-ref: 'my-app:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy
      - name: Preserve Trivy scan artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif
          if-no-files-found: warn
